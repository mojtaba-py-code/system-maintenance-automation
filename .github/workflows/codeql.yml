# GitHub's static analysis engine. Complements ci.yml: ruff's "S" ruleset
# (Bandit) flags insecure API usage one statement at a time, while CodeQL
# tracks taint between procedures. This toolkit deletes files, restores
# backups and runs privileged maintenance, so a path built from configuration
# and used many frames later is exactly the shape it is good at catching.
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, so a query published after this code was written still reaches it.
    - cron: "52 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      # Required to upload the SARIF results to the Security tab.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          # The default suite: every security query, none of the quality ones.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:python"
