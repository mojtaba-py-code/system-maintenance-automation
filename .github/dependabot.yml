version: 2

updates:
  # Runtime and development dependencies.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  # Keep the CI actions themselves patched -- a stale third-party action is a
  # supply-chain risk in its own right.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # One PR for every action: CodeQL's init and analyze must move together.
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
